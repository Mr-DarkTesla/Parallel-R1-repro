data:
  train_batch_size: 8
  micro_batch_size: null
  micro_batch_size_per_gpu: 1
  train_files: ${PROJECT_ROOT}/exps/sft-unseen-three-datasets-20261008/canary-train.parquet
  val_files: ${PROJECT_ROOT}/exps/sft-unseen-three-datasets-20261008/canary-val.parquet
  prompt_key: problem
  response_key: response
  prompt_dict_keys: []
  response_dict_keys: []
  multiturn:
    enable: false
    messages_key: messages
    tools_key: tools
    enable_thinking_key: enable_thinking
  max_length: 32768
  trim_padding: true
  truncation: error
  balance_dp_token: false
  chat_template: null
  custom_cls:
    path: null
    name: null
  use_shm: false
  num_workers: 2
  parallel_attention: true
  prompt_messages_key: prompt_messages
  defer_parallel_mask: true
model:
  partial_pretrain: ${PROJECT_ROOT}/exps/sft-unseen-three-datasets-20261008/base
  use_shm: false
  fsdp_config:
    model_dtype: fp32
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false
  external_lib: null
  enable_gradient_checkpointing: true
  trust_remote_code: false
  lora_rank: 0
  lora_alpha: 16
  target_modules: all-linear
  use_liger: false
  strategy: fsdp2
optim:
  lr: 1.0e-05
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
use_remove_padding: false
trainer:
  default_local_dir: ${PROJECT_ROOT}/exps/sft-unseen-three-datasets-20261008/runs/00_longest_canary/checkpoints
  default_hdfs_dir: null
  project_name: Parallel-R1
  experiment_name: 00_longest_canary
  total_epochs: 1
  total_training_steps: 1
  logger:
  - console
  seed: 1
  save_freq: -1
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 8
  max_ckpt_to_keep: null
  resume_mode: disable
  resume_from_path: null
  checkpoint:
    save_contents:
    - model
    - optimizer
    - extra
    load_contents: ${trainer.checkpoint.save_contents}
  device: cuda
  final_dir: ${PROJECT_ROOT}/exps/sft-unseen-three-datasets-20261008/runs/00_longest_canary/final
