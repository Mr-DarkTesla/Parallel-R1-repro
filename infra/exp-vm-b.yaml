# Retained GPU pod after the 2026-10-07 reduction. A stays at zero; both PVCs are preserved.
# GPU pod for parallel experiments. Project data lives on the PVC at /work; the rest of the disk is ephemeral.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vcharkin-exp-vm-b
  namespace: shared-dzen-ml
spec:
  replicas: 1
  serviceName: vcharkin-exp-vm-b
  selector:
    matchLabels:
      app: vcharkin-exp-vm-b
  template:
    metadata:
      labels:
        app: vcharkin-exp-vm-b
        parallel-r1-gpu-pool: split
        repository/git: "true"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                parallel-r1-gpu-pool: split
            topologyKey: kubernetes.io/hostname
      containers:
      - name: vcharkin-exp-vm-b
        image: registry-gitlab.corp.mail.ru/platforma-adm/ml/registry/dzen-ml/ml-korshunov-ale-image-zsh-ub22.04-cu121@sha256:57a03ce8b39787dfd9b7ab9e98c03de75b29e076a0573123cefa62e92c50730b
        command: ["bash", "/work/runner-src/scripts/run_gpu_queues.sh", "2"]
        resources:
          limits:
            cpu: "54"
            memory: 244Gi
            nvidia.com/gpu.h100.pa: "2"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /work
          name: work
      securityContext:
        fsGroup: 100
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: work
        persistentVolumeClaim:
          claimName: vcharkin-parallel-r1-b-pvc
