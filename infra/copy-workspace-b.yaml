# Run after the old GPU pods stop and detach the source PVC. No GPU allocation or generation.
apiVersion: batch/v1
kind: Job
metadata:
  name: vcharkin-pr1-copy-b
  namespace: shared-dzen-ml
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: vcharkin-pr1-copy-b
    spec:
      restartPolicy: Never
      containers:
      - name: copy
        image: registry-gitlab.corp.mail.ru/platforma-adm/ml/registry/dzen-ml/ml-korshunov-ale-image-zsh-ub22.04-cu121@sha256:57a03ce8b39787dfd9b7ab9e98c03de75b29e076a0573123cefa62e92c50730b
        resources:
          limits:
            cpu: "8"
            memory: 32Gi
            vk.team/cpu.slots: "32"
        command: ["bash", "-c"]
        args:
        - |
          set -euo pipefail
          for q in /source/queue/gpu*.txt; do echo "SOURCE $q lines=$(grep -c . "$q" || true)"; cat "$q"; done
          # Plain cp was OOMKilled at the 32Gi limit twice, even with periodic sync: big files bypass the page cache,
          # small ones go through tar with periodic sync; memory.stat is logged for diagnosis.
          mem=/sys/fs/cgroup/memory.stat; [ -f $mem ] || mem=/sys/fs/cgroup/memory/memory.stat
          (i=0; while sleep 5; do sync -f /work; i=$((i+1)); [ $((i % 6)) = 0 ] && echo "MEM $(date +%T) $(grep -E '^(anon|file|file_dirty|file_writeback|kernel|slab|sock|rss|cache|dirty|writeback) ' $mem | tr '\n' ' ')"; done) &
          monitor=$!
          for dir in assets venv bench_data; do
            echo "COPY $dir $(date -Iseconds)"
            mkdir -p "/work/$dir"
            (cd "/source/$dir" && find . \( ! -type f -o -size -65536k \) -print0 | tar --null --no-recursion -T - -cf -) | tar -C "/work/$dir" -xpf -
            (cd "/source/$dir" && find . -type f -size +65535k -print0) | while IFS= read -r -d '' f; do
              echo "BIG $dir/$f $(stat -c %s "/source/$dir/$f") $(date +%T)"
              dd if="/source/$dir/$f" of="/work/$dir/$f" bs=64M iflag=direct oflag=direct status=none
              touch -r "/source/$dir/$f" "/work/$dir/$f"
              chmod --reference="/source/$dir/$f" "/work/$dir/$f"
            done
          done
          kill $monitor
          echo "COPY frozen source commits $(date -Iseconds)"
          git init -q /work/parallel-r1
          git -C /work/parallel-r1 fetch /source/parallel-r1 '+refs/heads/*:refs/heads/*'
          git -C /work/parallel-r1 checkout -q --detach "$(git -C /source/parallel-r1 rev-parse HEAD)"
          for dir in setup-src bench-src runner-src; do
            # /source/$dir/.git points to /work/parallel-r1, which is the target here.
            commit=$(git --git-dir="/source/parallel-r1/.git/worktrees/$dir" rev-parse HEAD)
            git -C /work/parallel-r1 worktree add -q --detach "/work/$dir" "$commit"
            if [ -d "/source/$dir/verl/data_preprocess_scripts/data" ]; then
              cp -a "/source/$dir/verl/data_preprocess_scripts/data/." "/work/$dir/verl/data_preprocess_scripts/data/"
            fi
            echo "$dir $commit"
          done
          mkdir -p /work/queue
          touch /work/queue/gpu0.txt /work/queue/gpu1.txt
          /work/venv/bin/python -c 'import torch, transformers, verl; print(torch.__version__, transformers.__version__)'
          test -s /work/assets/Qwen3-0.6B-Base-add-special-token/config.json
          test -s /work/assets/parathinker/train_mix.parquet
          date -Iseconds > /work/COPY_READY
          echo COPY_READY
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: target
          mountPath: /work
      securityContext:
        fsGroup: 100
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: vcharkin-parallel-r1-pvc
          readOnly: true
      - name: target
        persistentVolumeClaim:
          claimName: vcharkin-parallel-r1-b-pvc
