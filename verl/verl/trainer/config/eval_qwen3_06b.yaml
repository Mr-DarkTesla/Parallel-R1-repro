defaults:
  - _generated_ppo_trainer
  - _self_

data:
  val_files: data_preprocess_scripts/data/APO_combine/adaptive_parallel_thinking_final_with_prompt_v3/rl_all_accuracy_reward/test.parquet
  train_files: ${data.val_files}
  train_batch_size: 8
  val_batch_size: 64
  return_raw_chat: true
  max_prompt_length: 2000
  max_response_length: 3000
  filter_overlong_prompts: false
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:R1_EVAL_MODEL}
    use_remove_padding: false
    enable_gradient_checkpointing: false
  actor:
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    use_torch_compile: false
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    agent:
      num_workers: ${trainer.n_gpus_per_node}
      max_iterations_for_parallel_thinking: 4
      max_path_response_length: 4096
    val_kwargs:
      temperature: 1.0
      do_sample: true
      n: 1

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

custom_reward_function:
  path: training_scripts/eval_score.py
  name: compute_score

trainer:
  project_name: Parallel-R1
  experiment_name: ${oc.env:R1_EVAL_NAME}
  n_gpus_per_node: 8
  nnodes: 1
  logger: [console]
  val_before_train: true
  val_only: true
  resume_mode: disable
  total_epochs: 1
  default_local_dir: ${oc.env:R1_OUTPUT_ROOT,checkpoints}/eval/${trainer.experiment_name}
  validation_data_dir: ${trainer.default_local_dir}

ray_init:
  num_cpus: 24

hydra:
  run:
    dir: ${oc.env:R1_SCRATCH_ROOT,/dev/shm/r1}/hydra/${trainer.experiment_name}
